<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketControl — Acceso</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="contenedor-principal">

        <section class="marca">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l1.5-5h15L21 9" />
                    <path d="M3 9h18v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9z" />
                    <path d="M9 13h6" />
                </svg>
            </div>
            <h1>MarketControl</h1>
            <p class="eslogan">Sistema de gestión comercial para tu bodega</p>
            <p class="lugar">Parcona, Ica — Perú <span class="pais">PE</span></p>
        </section>

        <section class="panel">
            <div class="tarjeta">

                <form class="vista activa" id="acceso" novalidate>
                    <h2>Iniciar sesión</h2>
                    <p class="subtitulo">Accede con tus credenciales</p>

                    <div class="campo">
                        <label for="a-usuario">Usuario</label>
                        <div class="control"><input id="a-usuario" type="text" placeholder="Nombre de usuario"
                                autocomplete="username"></div>
                    </div>

                    <div class="campo con-ojo">
                        <label for="a-clave">Contraseña</label>
                        <div class="control">
                            <input id="a-clave" type="password" placeholder="Tu contraseña"
                                autocomplete="current-password">
                            <button type="button" class="ojo" data-alternar="a-clave"
                                aria-label="Mostrar contraseña"></button>
                        </div>
                    </div>

                    <button type="submit" class="boton-enviar">Iniciar Sesión</button>

                    <div class="mensaje" id="acceso-msj"></div>
                </form>

            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>

</html>
