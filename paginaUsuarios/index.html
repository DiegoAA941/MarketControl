<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketControl</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <nav class="encabezado">
            <div class="barra-superior">
                <p class="logo">MarketControl</p>
                <button type="button" class="boton-buscar"></button>
                <form action="" method="get">
                    <input type="search" class="buscador-lupa" name="" placeholder="Buscar productos...">
                </form>
                <div class="carrito-contenedor">
                    <button type="button" class="boton-carrito">Carrito</button>
                    <div class="carrito-sidebar">
                        <div class="carrito-cabecera">
                            <h3>Carrito</h3>
                            <button class="carrito-cerrar">x</button>
                        </div>
                        <div class="carrito-cuerpo">
                            <div class="carrito-img"></div>
                            <h4>Carrito vacío</h4>
                            <p>Agregar productos para comenzar</p>
                            <button class="boton-accion">Ver productos</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="categoria">
                <button class="categoria-producto activo">Todos</button>
                <button class="categoria-producto">Lácteos</button>
                <button class="categoria-producto">Abarrotes</button>
                <button class="categoria-producto">Panadería</button>
                <button class="categoria-producto">Bebidas</button>
                <button class="categoria-producto">Verduras</button>
                <button class="categoria-producto">Carnes</button>
            </div>
        </nav>
    </header>
    <main>
        <div class="catalogo-info">
            <p><span class="cantidad-producto">0</span> productos</p>
            <div class="ordenar-producto">
                <button type="" class="boton-ordenar">Ordenar <span>▼</span></button>
                <div class="ordenar-opciones">
                    <button type="button">Precio: Menor a Mayor</button>
                    <button type="button">Precio: Mayor a Menor</button>
                    <button type="button">Nombre: A-Z</button>
                </div>
            </div>
        </div>
        <div class="productos-grid">
            
        </div>
    </main>
</body>
<script src="script.js"></script>

</html>
