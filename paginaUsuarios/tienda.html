<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodega el Progreso · Tienda</title>
    <link rel="stylesheet" href="tienda.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="marquesina" id="marquesina" aria-hidden="true">
            <div class="marquesina__pista" id="marquesina-pista"></div>
        </div>
        <nav class="encabezado">
            <div class="barra-superior">
                <p class="logo">Bodega el Progreso</p>

                <button type="button" class="boton-buscar" aria-label="Buscar productos" aria-expanded="false"></button>

                <form role="search" action="" method="get">
                    <input type="search" class="buscador-lupa" name="q" aria-label="Buscar productos"
                        placeholder="Buscar productos...">
                </form>

                <div class="carrito-contenedor">
                    <button type="button" class="boton-carrito" aria-label="Abrir carrito de compras">
                        Carrito
                        <span class="carrito-badge" hidden>0</span>
                    </button>

                    <aside class="carrito-sidebar" role="dialog" aria-modal="true" aria-label="Carrito de compras"
                        aria-hidden="true">
                        <div class="carrito-cabecera">
                            <h3>Carrito</h3>
                            <button type="button" class="carrito-cerrar" aria-label="Cerrar carrito">&times;</button>
                        </div>
                        <div class="carrito-cuerpo vacio">
                            <div class="carrito-img"></div>
                            <h4>Carrito vacío</h4>
                            <p>Agrega productos para comenzar</p>
                        </div>
                    </aside>
                </div>
            </div>

            <div class="categoria" role="group" aria-label="Filtrar por categoría">
                <button type="button" class="categoria-producto activo" data-categoria="TODOS">Todos</button>
            </div>
        </nav>
    </header>

    <main id="contenido">
        <div class="catalogo-info">
            <p><span class="cantidad-producto">0</span> productos</p>
            <div class="ordenar-producto">
                <button type="button" class="boton-ordenar" aria-haspopup="true" aria-expanded="false">
                    <span class="orden-actual">Ordenar</span> <span aria-hidden="true">▼</span>
                </button>
                <div class="ordenar-opciones" role="menu">
                    <button type="button" role="menuitem" data-orden="precio-asc">Precio: Menor a Mayor</button>
                    <button type="button" role="menuitem" data-orden="precio-desc">Precio: Mayor a Menor</button>
                    <button type="button" role="menuitem" data-orden="nombre-az">Nombre: A-Z</button>
                </div>
            </div>
        </div>

        <div class="productos-grid"></div>
    </main>

    <div class="overlay"></div>

    <!-- ===================== CHECKOUT (Delivery / Recojo) ===================== -->
    <div class="checkout-overlay" id="checkout-overlay" hidden>
        <div class="checkout" role="dialog" aria-modal="true" aria-labelledby="checkout-titulo">
            <div class="checkout-cab">
                <h3 id="checkout-titulo">Finalizar pedido</h3>
                <button type="button" class="checkout-cerrar" id="checkout-cerrar" aria-label="Cerrar">&times;</button>
            </div>

            <div class="checkout-tipo" role="group" aria-label="Tipo de entrega">
                <button type="button" class="tipo-btn activo" data-tipo="delivery">Delivery</button>
                <button type="button" class="tipo-btn" data-tipo="recojo">Recojo en tienda</button>
            </div>
            <p class="checkout-ayuda" id="checkout-ayuda">El pedido se registra y te contactamos para coordinar la entrega.</p>

            <form id="checkout-form" class="checkout-form">
                <label>Nombre completo <span>*</span>
                    <input id="ck-nombres" type="text" required>
                </label>
                <label>Teléfono / WhatsApp <span>*</span>
                    <input id="ck-telefono" type="text" inputmode="tel" required>
                </label>
                <div class="solo-delivery" id="solo-delivery">
                    <label>Dirección de entrega <span>*</span>
                        <input id="ck-direccion" type="text">
                    </label>
                    <label>Referencia
                        <input id="ck-referencia" type="text" placeholder="Ej. frente al parque">
                    </label>
                    <div class="ck-metodo-pago">
                        <span class="ck-metodo-pago__label">Método de pago <span>*</span></span>
                        <div class="ck-metodo-pago__opciones">
                            <label class="ck-metodo-pago__opcion">
                                <input type="radio" name="ck-metodo" id="ck-metodo-efectivo" value="Efectivo" checked>
                                Efectivo
                            </label>
                            <label class="ck-metodo-pago__opcion">
                                <input type="radio" name="ck-metodo" id="ck-metodo-yape" value="Yape">
                                Yape
                            </label>
                        </div>
                    </div>
                </div>
                <label>Observaciones
                    <textarea id="ck-obs" rows="2" placeholder="Indicaciones adicionales (opcional)"></textarea>
                </label>
                <div class="ck-desglose" id="ck-desglose"></div>
                <div class="checkout-total">Total: <strong id="ck-total">S/0.00</strong></div>
                <button type="submit" class="boton-accion" id="ck-enviar">Enviar pedido por WhatsApp</button>
                <p class="checkout-nota" id="ck-nota" hidden></p>
            </form>
        </div>
    </div>

    <div class="tienda-toast" id="tienda-toast" hidden></div>

    <script src="carrito-storage.js"></script>
    <script src="tienda.js"></script>
</body>

</html>
